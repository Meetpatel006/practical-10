name: array-sort-ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practical_10/array-sort-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: practical_10/array-sort-app/package.json
      - run: npm ci || npm install
      - run: npm test
      - run: docker build -t ghcr.io/${{ github.repository_owner }}/array-sort-app:${{ github.sha }} .
      - run: docker run -d -p 8888:8888 --name sort-api ghcr.io/${{ github.repository_owner }}/array-sort-app:${{ github.sha }}
      - run: sleep 5 && curl -s "http://localhost:8888/api/sort?algo=quick&arr=5,3,8,1" | grep "1,3,5,8"
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/array-sort-app:${{ github.sha }}

  cd-pages:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: practical_10/array-sort-app/public
      - id: deploy
        uses: actions/deploy-pages@v4
